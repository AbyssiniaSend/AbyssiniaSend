
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#071b16">
  <title>AbyssiniaSend | Secure Login</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      color: #f5f7f2;
      background: linear-gradient(135deg, #061510, #123d2b);
    }

    .card {
      width: 100%;
      max-width: 440px;
      padding: 32px;
      border: 1px solid #b89b50;
      border-radius: 20px;
      background: #0c2118;
      box-shadow: 0 20px 60px #0007;
    }

    .logo-image {
      display: block;
      width: 120px;
      height: 120px;
      object-fit: contain;
      margin: 0 auto 16px;
    }

    .brand-name {
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      color: #e3c46b;
      margin: 0 0 8px;
      letter-spacing: .3px;
    }

    .subtitle {
      text-align: center;
      color: #c3d1c8;
      margin: 0 0 26px;
      line-height: 1.5;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 22px;
    }

    .tabs button {
      flex: 1;
      padding: 12px;
      border: 1px solid #355846;
      border-radius: 9px;
      color: #f5f7f2;
      background: #142e21;
      cursor: pointer;
      font-size: 15px;
    }

    .tabs button.active {
      background: #1e6847;
      border-color: #d5b65b;
      color: #ffffff;
    }

    label {
      display: block;
      margin: 14px 0 7px;
      font-size: 14px;
      color: #e5e9e3;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #45634f;
      border-radius: 9px;
      background: #081810;
      color: white;
      outline: none;
      font-size: 15px;
    }

    input:focus {
      border-color: #d5b65b;
      box-shadow: 0 0 0 2px #d5b65b22;
    }

    .submit {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: 1px solid #e2c46a;
      border-radius: 9px;
      background: #1e6847;
      color: #ffffff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background .2s;
    }

    .submit:hover {
      background: #287d56;
    }

    .submit:disabled {
      opacity: .6;
      cursor: wait;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 22px 0;
      color: #b9c9bd;
      font-size: 13px;
    }

    .divider span {
      flex: 1;
      height: 1px;
      background: #355846;
    }

    .google-button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 9px;
      background: #ffffff;
      color: #202124;
      text-decoration: none;
      font-size: 15px;
      font-weight: bold;
      transition: background .2s;
    }

    .google-button:hover {
      background: #eaf1f8;
    }

    #message {
      margin-top: 16px;
      font-size: 14px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .note {
      margin-top: 24px;
      color: #b9c9bd;
      text-align: center;
      font-size: 12px;
      line-height: 1.7;
    }

    [hidden] {
      display: none !important;
    }

    @media (max-width: 420px) {
      .card {
        padding: 24px 20px;
      }

      .logo-image {
        width: 100px;
        height: 100px;
      }

      .brand-name {
        font-size: 25px;
      }
    }
  </style>
</head>

<body>
  <main class="card">

    <img
      class="logo-image"
    src="/logo.png"
      alt="AbyssiniaSend Logo"
    >

    <h1 class="brand-name">AbyssiniaSend</h1>
    <p class="subtitle">Secure Account Access</p>

    <div class="tabs">
      <button type="button" id="loginTab" class="active">
        Login
      </button>

      <button type="button" id="signupTab">
        Sign Up
      </button>
    </div>

    <form id="authForm">
      <div id="nameGroup" hidden>
        <label for="fullName">Full Name</label>
        <input
          id="fullName"
          name="fullName"
          autocomplete="name"
          maxlength="100"
        >
      </div>

      <label for="email">Email Address</label>
      <input
        id="email"
        name="email"
        type="email"
        autocomplete="email"
        required
        maxlength="254"
      >

      <label for="password">Password</label>
      <input
        id="password"
        name="password"
        type="password"
        autocomplete="current-password"
        required
        minlength="8"
        maxlength="128"
      >

      <button class="submit" id="submitButton" type="submit">
        Login Securely
      </button>
    </form>

    <div class="divider">
      <span></span>
      OR
      <span></span>
    </div>

    <a class="google-button" href="/auth/google">
      <svg
        width="20"
        height="20"
        viewBox="0 0 48 48"
        aria-hidden="true"
      >
        <path fill="#EA4335"
          d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4"
          d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.73 7.18l7.64 5.92c4.46-4.12 7.13-10.2 7.13-17.57z"/>
        <path fill="#FBBC05"
          d="M10.53 28.59A14.4 14.4 0 0 1 9.75 24c0-1.59.27-3.13.76-4.59l-7.98-6.19A23.9 23.9 0 0 0 0 24c0 3.87.93 7.52 2.56 10.78z"/>
        <path fill="#34A853"
          d="M24 48c6.48 0 11.93-2.13 15.9-5.78l-7.64-5.92c-2.12 1.42-4.84 2.26-8.26 2.26-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>
      Continue with Google
    </a>

    <p id="message" role="status" aria-live="polite"></p>

    <div class="note">
      Secure access · Never share your password
    </div>

  </main>

  <script>
    const form = document.getElementById("authForm");
    const loginTab = document.getElementById("loginTab");
    const signupTab = document.getElementById("signupTab");
    const nameGroup = document.getElementById("nameGroup");
    const fullName = document.getElementById("fullName");
    const email = document.getElementById("email");
    const password = document.getElementById("password");
    const submitButton = document.getElementById("submitButton");
    const message = document.getElementById("message");

    let mode = "login";

    function setMode(nextMode) {
      mode = nextMode;

      const signingUp = mode === "signup";

      nameGroup.hidden = !signingUp;
      fullName.required = signingUp;

      password.autocomplete = signingUp
        ? "new-password"
        : "current-password";

      loginTab.classList.toggle("active", !signingUp);
      signupTab.classList.toggle("active", signingUp);

      submitButton.textContent = signingUp
        ? "Create Account"
        : "Login Securely";

      message.textContent = "";
    }

    loginTab.addEventListener("click", () => setMode("login"));
    signupTab.addEventListener("click", () => setMode("signup"));

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      message.textContent = "";
      submitButton.disabled = true;

      try {
        const payload = {
          fullName: fullName.value.trim(),
          email: email.value.trim(),
          password: password.value
        };

        const response = await fetch(
          mode === "login" ? "/api/login" : "/api/register",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            credentials: "same-origin",
            body: JSON.stringify(payload)
          }
        );

        const data = await response.json();

        if (!response.ok) {
          throw new Error(
            data.message ||
            data.error ||
            "Request failed. Please check your details."
          );
        }

        window.location.replace("/");
      } catch (error) {
        message.textContent =
          error.message === "Failed to fetch"
            ? "Cannot connect to the server. Please try again."
            : error.message;
      } finally {
        submitButton.disabled = false;
      }
    });
  </script>
</body>
</html>
