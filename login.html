
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#071426">
  <title>AbyssiniaSend | Secure Account</title>

  <style>
    :root {
      --navy: #071426;
      --card: #10243d;
      --gold: #f5c451;
      --white: #ffffff;
      --muted: #b7c4d6;
      --border: #2a405c;
      --danger: #ff7777;
      --success: #78e0a3;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--white);
      background:
        radial-gradient(circle at top, #183453 0, var(--navy) 55%);
    }

    .container {
      width: 100%;
      max-width: 460px;
    }

    .brand {
      text-align: center;
      margin-bottom: 22px;
    }

    /* Logo display only */
    .brand-logo {
      display: block;
      width: 190px;
      max-width: 100%;
      height: auto;
      margin: 0 auto 12px;
      object-fit: contain;
    }

    .brand p {
      color: var(--muted);
      margin: 0;
      font-size: 14px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 25px;
      box-shadow: 0 18px 45px #0005;
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding: 5px;
      margin-bottom: 22px;
      border-radius: 12px;
      background: #071426;
    }

    .tab {
      padding: 12px;
      border: 0;
      border-radius: 9px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
    }

    .tab.active {
      background: var(--gold);
      color: #071426;
    }

    .field {
      margin-bottom: 15px;
    }

    .name-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 13px;
      font-weight: bold;
      color: #e4ebf5;
    }

    input,
    select {
      display: block;
      width: 100%;
      min-height: 46px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: #071426;
      color: var(--white);
      font-size: 15px;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 2px #f5c45122;
    }

    select option {
      background: #10243d;
      color: white;
    }

    .primary-btn,
    .google-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      min-height: 48px;
      border-radius: 9px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
    }

    .primary-btn {
      margin-top: 8px;
      border: 0;
      background: var(--gold);
      color: #071426;
    }

    .primary-btn:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .google-btn {
      border: 1px solid var(--border);
      background: #ffffff;
      color: #202124;
    }

    .google-icon {
      font-size: 19px;
      font-weight: bold;
      color: #4285f4;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 20px 0;
      color: var(--muted);
      font-size: 12px;
    }

    .divider::before,
    .divider::after {
      content: "";
      height: 1px;
      flex: 1;
      background: var(--border);
    }

    .message {
      display: none;
      padding: 12px;
      margin-bottom: 16px;
      border-radius: 9px;
      font-size: 14px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .message.error {
      display: block;
      color: var(--danger);
      background: #ff777714;
      border: 1px solid #ff777744;
    }

    .message.success {
      display: block;
      color: var(--success);
      background: #78e0a314;
      border: 1px solid #78e0a344;
    }

    .hidden {
      display: none !important;
    }

    .note {
      margin: 18px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
      text-align: center;
    }

    .footer {
      text-align: center;
      margin-top: 18px;
      color: var(--muted);
      font-size: 12px;
    }

    @media (max-width: 380px) {
      .card {
        padding: 18px;
      }

      .name-row {
        grid-template-columns: 1fr;
        gap: 0;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <header class="brand">
      <img
        src="/logo.png"
        alt="AbyssiniaSend Global Transfer Logo"
        class="brand-logo"
      >
      <p>Secure access to your account</p>
    </header>

    <section class="card">
      <div class="tabs">
        <button
          type="button"
          id="loginTab"
          class="tab active">
          Login
        </button>

        <button
          type="button"
          id="signupTab"
          class="tab">
          Sign Up
        </button>
      </div>

      <div id="message" class="message" role="status" aria-live="polite"></div>

      <form id="authForm" novalidate>
        <div id="signupFields" class="hidden">
          <div class="name-row">
            <div class="field">
              <label for="firstName">First Name</label>
              <input
                id="firstName"
                name="firstName"
                type="text"
                autocomplete="given-name"
                maxlength="60"
                placeholder="First name">
            </div>

            <div class="field">
              <label for="lastName">Last Name</label>
              <input
                id="lastName"
                name="lastName"
                type="text"
                autocomplete="family-name"
                maxlength="60"
                placeholder="Last name">
            </div>
          </div>

          <div class="field">
            <label for="country">Country</label>
            <select id="country" name="country">
              <option value="">🌍 Select your country</option>
            </select>
          </div>
        </div>

        <div class="field">
          <label for="email">Email Address</label>
          <input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            maxlength="254"
            placeholder="you@example.com"
            required>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            minlength="8"
            placeholder="Enter your password"
            required>
        </div>

        <div id="confirmField" class="field hidden">
          <label for="confirmPassword">Confirm Password</label>
          <input
            id="confirmPassword"
            name="confirmPassword"
            type="password"
            autocomplete="new-password"
            minlength="8"
            placeholder="Enter your password again">
        </div>

        <button
          type="submit"
          id="submitBtn"
          class="primary-btn">
          Login
        </button>
      </form>

      <div class="divider">OR</div>

      <a class="google-btn" href="/auth/google">
        <span class="google-icon">G</span>
        <span>Continue with Google</span>
      </a>

      <p class="note">
        AbyssiniaSend is a demonstration project.
        No real money transfers are performed.
      </p>
    </section>

    <footer class="footer">
      © <span id="year"></span> AbyssiniaSend
    </footer>
  </main>

  <script>
    "use strict";

    const authForm = document.getElementById("authForm");
    const loginTab = document.getElementById("loginTab");
    const signupTab = document.getElementById("signupTab");
    const signupFields = document.getElementById("signupFields");
    const confirmField = document.getElementById("confirmField");
    const firstName = document.getElementById("firstName");
    const lastName = document.getElementById("lastName");
    const country = document.getElementById("country");
    const email = document.getElementById("email");
    const password = document.getElementById("password");
    const confirmPassword = document.getElementById("confirmPassword");
    const submitBtn = document.getElementById("submitBtn");
    const message = document.getElementById("message");

    let mode = "login";

    document.getElementById("year").textContent =
      new Date().getFullYear();

    // ISO country/territory codes with flags.
    const countryCodes = [
      "AD","AE","AF","AG","AI","AL","AM","AO","AQ","AR","AS","AT",
      "AU","AW","AX","AZ","BA","BB","BD","BE","BF","BG","BH","BI",
      "BJ","BL","BM","BN","BO","BQ","BR","BS","BT","BV","BW","BY",
      "BZ","CA","CC","CD","CF","CG","CH","CI","CK","CL","CM","CN",
      "CO","CR","CU","CV","CW","CX","CY","CZ","DE","DJ","DK","DM",
      "DO","DZ","EC","EE","EG","EH","ER","ES","ET","FI","FJ","FK",
      "FM","FO","FR","GA","GB","GD","GE","GF","GG","GH","GI","GL",
      "GM","GN","GP","GQ","GR","GS","GT","GU","GW","GY","HK","HM",
      "HN","HR","HT","HU","ID","IE","IL","IM","IN","IO","IQ","IR",
      "IS","IT","JE","JM","JO","JP","KE","KG","KH","KI","KM","KN",
      "KP","KR","KW","KY","KZ","LA","LB","LC","LI","LK","LR","LS",
      "LT","LU","LV","LY","MA","MC","MD","ME","MF","MG","MH","MK",
      "ML","MM","MN","MO","MP","MQ","MR","MS","MT","MU","MV","MW",
      "MX","MY","MZ","NA","NC","NE","NF","NG","NI","NL","NO","NP",
      "NR","NU","NZ","OM","PA","PE","PF","PG","PH","PK","PL","PM",
      "PN","PR","PS","PT","PW","PY","QA","RE","RO","RS","RU","RW",
      "SA","SB","SC","SD","SE","SG","SH","SI","SJ","SK","SL","SM",
      "SN","SO","SR","SS","ST","SV","SX","SY","SZ","TC","TD","TF",
      "TG","TH","TJ","TK","TL","TM","TN","TO","TR","TT","TV","TW",
      "TZ","UA","UG","UM","US","UY","UZ","VA","VC","VE","VG","VI",
      "VN","VU","WF","WS","YE","YT","ZA","ZM","ZW"
    ];

    const countryNames = new Intl.DisplayNames(["en"], {
      type: "region"
    });

    function flagEmoji(code) {
      return String.fromCodePoint(
        ...Array.from(code, char => 127397 + char.charCodeAt(0))
      );
    }

    countryCodes
      .map(code => ({
        code,
        name: countryNames.of(code)
      }))
      .filter(item => item.name && item.name !== item.code)
      .sort((a, b) => a.name.localeCompare(b.name))
      .forEach(item => {
        const option = document.createElement("option");
        option.value = item.code;
        option.textContent =
          `${flagEmoji(item.code)} ${item.name}`;
        country.appendChild(option);
      });

    function showMessage(text, type) {
      message.textContent = text;
      message.className = "message " + type;
    }

    function clearMessage() {
      message.textContent = "";
      message.className = "message";
    }

    function setMode(nextMode) {
      mode = nextMode;
      const isSignup = mode === "signup";

      loginTab.classList.toggle("active", !isSignup);
      signupTab.classList.toggle("active", isSignup);

      signupFields.classList.toggle("hidden", !isSignup);
      confirmField.classList.toggle("hidden", !isSignup);

      firstName.required = isSignup;
      lastName.required = isSignup;
      country.required = isSignup;
      confirmPassword.required = isSignup;

      password.autocomplete = isSignup
        ? "new-password"
        : "current-password";

      submitBtn.textContent = isSignup
        ? "Create Account"
        : "Login";

      clearMessage();
    }

    loginTab.addEventListener("click", () => setMode("login"));
    signupTab.addEventListener("click", () => setMode("signup"));

    authForm.addEventListener("submit", async event => {
      event.preventDefault();
      clearMessage();

      if (!authForm.reportValidity()) {
        return;
      }

      const cleanEmail = email.value.trim().toLowerCase();
      const cleanPassword = password.value;

      if (mode === "signup") {
        if (firstName.value.trim().length < 1 ||
            lastName.value.trim().length < 1) {
          showMessage("Please enter your first and last name.", "error");
          return;
        }

        if (cleanPassword.length < 8) {
          showMessage("Password must be at least 8 characters.", "error");
          return;
        }

        if (cleanPassword !== confirmPassword.value) {
          showMessage("Passwords do not match.", "error");
          return;
        }

        if (!country.value) {
          showMessage("Please select your country.", "error");
          return;
        }
      }

      const payload = {
        email: cleanEmail,
        password: cleanPassword
      };

      let endpoint = "/api/login";

      if (mode === "signup") {
        endpoint = "/api/register";
        payload.firstName = firstName.value.trim();
        payload.lastName = lastName.value.trim();
        payload.country = country.value;
        payload.confirmPassword = confirmPassword.value;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = mode === "signup"
        ? "Creating account..."
        : "Logging in...";

      try {
        const response = await fetch(endpoint, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          credentials: "same-origin",
          body: JSON.stringify(payload)
        });

        const result = await response.json().catch(() => ({}));

        if (!response.ok) {
          throw new Error(
            result.message ||
            result.error ||
            "Request failed. Please try again."
          );
        }

        showMessage(
          mode === "signup"
            ? "Account created. Opening your account..."
            : "Login successful. Opening your account...",
          "success"
        );

        window.location.replace("/");
      } catch (error) {
        showMessage(
          error.message || "A network error occurred. Please try again.",
          "error"
        );
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = mode === "signup"
          ? "Create Account"
          : "Login";
      }
    });

    setMode("login");
  </script>
</body>
</html>
